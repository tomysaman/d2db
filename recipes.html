<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo II Codex — Cube Recipes</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" id="theme-minimal" />
  <link rel="stylesheet" href="styles-paper.css" id="theme-paper" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="recipes-styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════ HEADER ══ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-block">
        <h1 class="site-title">Diablo II <em>Codex</em></h1>
        <p class="site-subtitle">Diablo II: Resurrected · Reign of the Warlock</p>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">Runewords</a>
        <a href="sets.html" class="nav-link">Item Sets</a>
        <a href="recipes.html" class="nav-link active">Cube Recipes</a>
      </nav>
      <button type="button" class="theme-toggle" id="themeToggle">
        <span class="theme-toggle-swatch" aria-hidden="true"></span>
        <span class="theme-toggle-label">Paper theme</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════ FILTERS ══ -->
  <section class="filters-section">
    <div class="filters-inner">

      <div class="filter-block filter-search-block">
        <label class="filter-label">Search</label>
        <div class="search-stats-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Recipe, ingredient, or result..." autocomplete="off" />
          <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="statTotal">— recipes</span>
            <span class="stat-pill" id="statShown">— shown</span>
            <button class="reset-btn" id="resetBtn">Reset filters</button>
          </div>
        </div>
      </div>

      <div class="filter-block">
        <label class="filter-label">Category</label>
        <div class="pill-group" id="categoryFilter"></div>
      </div>

      <div class="filter-block hidden" id="subcategoryFilterBlock">
        <label class="filter-label">Type</label>
        <div class="pill-group" id="subcategoryFilter"></div>
      </div>

      <div class="filter-block filter-source-ladder-row">
        <div class="source-ladder-group">
          <label class="filter-label">Content</label>
          <div class="pill-group" id="contentFilter">
            <button class="pill active" data-content="all">All</button>
            <button class="pill" data-content="classic">Classic / LoD / 2.6</button>
            <button class="pill" data-content="new">Reign of the Warlock</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════ RESULTS ══ -->
  <main class="results-section">

    <div class="sort-bar">
      <span class="sort-label">Sort</span>
      <button class="sort-btn active" data-sort="category">Category</button>
      <button class="sort-btn" data-sort="name">Name</button>
    </div>

    <div id="recipesGrid" class="recipes-category-groups"></div>
    <div id="emptyState" class="empty-state hidden">
      <p>No recipes match your current filters.</p>
      <button class="reset-btn" onclick="resetAll()">Reset Filters</button>
    </div>
  </main>

  <!-- ═══════════════════════════════════ MODAL ══ -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Data sourced from Diablo II: Resurrected — Reign of the Warlock. Fan-made reference tool.</p>
  </footer>

  <script src="data/recipes-data.js"></script>
  <script src="recipes-app.js"></script>
</body>
</html>
