<!DOCTYPE html>
<!-- Source for og-image.png. Open at a 1200x630 viewport and screenshot the page to regenerate it. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Diablo II Codex share card</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background:
        radial-gradient(ellipse 70% 60% at 50% 38%, rgba(201,179,126,0.10), transparent 70%),
        #111010;
      color: #e8e4dc;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .frame {
      position: absolute;
      inset: 22px;
      border: 1px solid #3d3a36;
      pointer-events: none;
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid #2b2926;
    }
    .subtitle {
      font-size: 22px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a8a197;
    }
    h1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 124px;
      line-height: 1.05;
      color: #e8e4dc;
      margin: 14px 0 26px;
    }
    h1 em { color: #c9b37e; }
    .stats {
      display: flex;
      gap: 44px;
      font-size: 27px;
      color: #a8a197;
    }
    .stats b { font-weight: 500; }
    .rw b { color: #c9b37e; }
    .set b { color: #7fb069; }
    .cube b { color: #d9953f; }
    .runes {
      display: flex;
      gap: 18px;
      margin-top: 52px;
    }
    .runes img { width: 58px; height: 58px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <p class="subtitle">Diablo II: Resurrected · Reign of the Warlock</p>
  <h1>Diablo II <em>Codex</em></h1>
  <div class="stats">
    <span class="rw"><b>104</b> Runewords</span>
    <span class="set"><b>35</b> Item Sets</span>
    <span class="cube"><b>130</b> Cube Recipes</span>
  </div>
  <div class="runes">
    <img src="../runes/el.webp" alt="" />
    <img src="../runes/tal.webp" alt="" />
    <img src="../runes/shael.webp" alt="" />
    <img src="../runes/ist.webp" alt="" />
    <img src="../runes/vex.webp" alt="" />
    <img src="../runes/ber.webp" alt="" />
    <img src="../runes/jah.webp" alt="" />
    <img src="../runes/zod.webp" alt="" />
  </div>
</body>
</html>
