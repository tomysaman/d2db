    <path d="M1017 132v-12a6 6 0 0 1 12 0v12z"/>
    <circle cx="1082" cy="126" r="6"/>
  </g>

  <!-- the Cairn Stones, a ring of five on the far hill -->
  <g fill="#aeb68d">
    <rect x="748" y="176.0" width="10" height="17" rx="4"/>
    <rect x="764" y="169.7" width="10" height="22" rx="4"/>
    <rect x="781" y="171.4" width="10" height="19" rx="4"/>
    <rect x="798" y="166.0" width="10" height="23" rx="4"/>
    <rect x="815" y="171.6" width="10" height="16" rx="4"/>
  </g>

  <!-- the Rogue Encampment palisade and its watchtower -->
  <g>
    <path d="M58 250V202.1L63.5 194.1L69 202.1V250Z" fill="#8e6038"/>
    <path d="M70 250V204.9L75.5 196.9L81 204.9V250Z" fill="#7d5230"/>
    <path d="M82 250V203.3L87.5 195.3L93 203.3V250Z" fill="#8e6038"/>
    <path d="M94 250V205.4L99.5 197.4L105 205.4V250Z" fill="#7d5230"/>
    <path d="M106 250V205.6L111.5 197.6L117 205.6V250Z" fill="#8e6038"/>
    <path d="M118 250V200.6L123.5 192.6L129 200.6V250Z" fill="#7d5230"/>
    <path d="M130 250V200.1L135.5 192.1L141 200.1V250Z" fill="#8e6038"/>
    <path d="M142 250V207.5L147.5 199.5L153 207.5V250Z" fill="#7d5230"/>
    <path d="M154 250V202.3L159.5 194.3L165 202.3V250Z" fill="#8e6038"/>
    <path d="M166 250V202.1L171.5 194.1L177 202.1V250Z" fill="#7d5230"/>
    <path d="M178 250V209.0L183.5 201.0L189 209.0V250Z" fill="#8e6038"/>
    <path d="M190 250V204.2L195.5 196.2L201 204.2V250Z" fill="#7d5230"/>
    <path d="M202 250V207.5L207.5 199.5L213 207.5V250Z" fill="#8e6038"/>
    <path d="M214 250V204.3L219.5 196.3L225 204.3V250Z" fill="#7d5230"/>
