<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
  <!-- Meadow theme header: a quiet evening at the Rogue Encampment — the
       Tristram cathedral and the Cairn Stones on the far hill, the camp's
       palisade and watchtower, Rogue tents and the stash round the fire,
       two Fallen creeping over the ridge, a waypoint and a town portal.
       Flat shapes in the mixer palette (sage, moss, forest, sand, clay). -->
  <style>
    .fl { transform-box: fill-box; transform-origin: 50% 100%; }
    .f1 { animation: flick 1.1s ease-in-out infinite alternate; }
    .f2 { animation: flick .8s ease-in-out infinite alternate-reverse; }
    .f3 { animation: flick .55s ease-in-out infinite alternate; }
    .glow { animation: glow 1.6s ease-in-out infinite alternate; }
    .crows { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes flick {
      0% { transform: scale(1,1) skewX(0); }
      35% { transform: scale(.95,1.08) skewX(3deg); }
      70% { transform: scale(1.04,.94) skewX(-3deg); }
      100% { transform: scale(.98,1.04) skewX(1.5deg); }
    }
    @keyframes glow { from { opacity: .5; } to { opacity: .9; } }
    @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(16px); } }
    .flag { transform-box: fill-box; transform-origin: 0 50%; animation: wave 2.4s ease-in-out infinite alternate; }
    .wp { animation: pulse 2.6s ease-in-out infinite alternate; }
    .swirl { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 9s linear infinite; }
    .sneak { animation: sneak 6s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: skewY(-6deg) scaleX(.9); } to { transform: skewY(5deg) scaleX(1.05); } }
    @keyframes pulse { from { opacity: .35; } to { opacity: .95; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sneak { from { transform: translateX(0); } to { transform: translateX(-10px); } }
    @media (prefers-reduced-motion: reduce) { .f1, .f2, .f3, .glow, .crows, .flag, .wp, .swirl, .sneak { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0da"/>
      <stop offset="1" stop-color="#f6f0d6"/>
    </linearGradient>
    <radialGradient id="fireglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dda15e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#dda15e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wpglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8fc3d6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8fc3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8fc3d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fc3d6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="portal" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#eef6f4"/>
      <stop offset=".45" stop-color="#9cc9d8"/>
      <stop offset="1" stop-color="#3f7896"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="300" fill="url(#sky)"/>

  <!-- low sun and clouds -->
  <circle cx="900" cy="112" r="40" fill="#e9c99c" opacity=".75"/>
  <g fill="#fffdf0">
    <path d="M530 96a22 22 0 0 1 36-17 30 30 0 0 1 56 6 18 18 0 0 1 8 35h-94a14 14 0 0 1-6-24z"/>
    <path d="M1236 58a16 16 0 0 1 27-12 23 23 0 0 1 42 5 13 13 0 0 1 5 26h-70a11 11 0 0 1-4-19z" opacity=".85"/>
  </g>

  <!-- crows -->
  <g class="crows" fill="none" stroke="#283618" stroke-width="2.4" stroke-linecap="round" opacity=".7">
    <path d="M1196 50q7-7 14 0q7-7 14 0"/>
    <path d="M1232 36q5-5 10 0q5-5 10 0"/>
    <path d="M1178 64q5-5 10 0q5-5 10 0"/>
  </g>

  <!-- far hills -->
  <path d="M0 214C140 180 260 172 400 188S640 212 780 184 1040 150 1180 170 1440 196 1600 176V300H0Z" fill="#cfd6b0"/>

  <!-- Tristram cathedral on the far hill -->
  <g fill="#9aa378">
    <rect x="1034" y="128" width="96" height="48"/>
    <path d="M1030 130l52-26 52 26z"/>
    <rect x="1008" y="98" width="30" height="80"/>
    <path d="M1004 100l19-42 19 42z"/>
    <rect x="1126" y="112" width="24" height="66"/>
    <path d="M1123 114l15-32 15 32z"/>
    <rect x="1021" y="42" width="4" height="18"/>
    <rect x="1016" y="48" width="14" height="3"/>
