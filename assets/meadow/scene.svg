    <path d="M238 250V201.4L243.5 193.4L249 201.4V250Z" fill="#7d5230"/>
    <path d="M250 250V205.7L255.5 197.7L261 205.7V250Z" fill="#8e6038"/>
    <path d="M262 250V207.8L267.5 199.8L273 207.8V250Z" fill="#7d5230"/>
    <path d="M274 250V204.7L279.5 196.7L285 204.7V250Z" fill="#8e6038"/>
    <path d="M286 250V206.7L291.5 198.7L297 206.7V250Z" fill="#7d5230"/>
    <path d="M298 250V206.0L303.5 198.0L309 206.0V250Z" fill="#8e6038"/>
    <path d="M310 250V200.6L315.5 192.6L321 200.6V250Z" fill="#7d5230"/>
    <path d="M322 250V206.8L327.5 198.8L333 206.8V250Z" fill="#8e6038"/>
    <path d="M334 250V205.3L339.5 197.3L345 205.3V250Z" fill="#7d5230"/>
    <path d="M346 250V202.7L351.5 194.7L357 202.7V250Z" fill="#8e6038"/>
    <path d="M358 250V200.3L363.5 192.3L369 200.3V250Z" fill="#7d5230"/>
    <path d="M370 250V207.8L375.5 199.8L381 207.8V250Z" fill="#8e6038"/>
    <path d="M56 214L372 210" stroke="#5e3b20" stroke-width="4"/>
    <g transform="translate(0 24)">
    <g fill="#6b4426">
      <rect x="384" y="150" width="5" height="100"/><rect x="415" y="150" width="5" height="100"/>
      <path d="M386 196L418 170M386 170L418 196" stroke="#6b4426" stroke-width="3"/>
      <rect x="378" y="146" width="48" height="8" rx="1"/>
      <rect x="380" y="132" width="4" height="16"/><rect x="420" y="132" width="4" height="16"/>
    </g>
    <path d="M372 134L402 112L432 134Z" fill="#bc6c25"/>
    <path class="flag" d="M402 112V96M402 96l14 4-14 5z" fill="#dda15e" stroke="#5e3b20" stroke-width="1.5"/>
    </g>
  </g>

  <!-- middle hills -->
  <path d="M0 238C120 214 220 206 340 220S560 246 700 228 900 198 1040 206 1300 236 1440 222 1560 210 1600 214V300H0Z" fill="#a3b18a"/>

  <!-- two Fallen creeping over the ridge -->
  <g class="sneak" fill="#4a5530">
    <g transform="translate(1178 224) scale(1.25)"><circle cx="0" cy="-17" r="5"/><path d="M-3-21l-4-6 2 7M3-21l4-6-2 7"/><path d="M-5-13q5-4 10 0l2 9h-3l-2 4h-2l-1-4h-2l-2 4h-2l0-4h-3z"/><path d="M8-24L2 2" stroke="#4a5530" stroke-width="1.8" fill="none"/><path d="M8-24l-2 6 4-1z"/></g>
    <g transform="translate(1210 226) scale(1.25)"><circle cx="0" cy="-17" r="5"/><path d="M-3-21l-4-6 2 7M3-21l4-6-2 7"/><path d="M-5-13q5-4 10 0l2 9h-3l-2 4h-2l-1-4h-2l-2 4h-2l0-4h-3z"/><path d="M8-24L2 2" stroke="#4a5530" stroke-width="1.8" fill="none"/><path d="M8-24l-2 6 4-1z"/></g>
  </g>

  <!-- dead tree on the hill, kept low so the title stays clear -->
  <g transform="translate(470 238) scale(.8) translate(-232 -226)" fill="none" stroke="#4a5530" stroke-linecap="round">
    <path d="M232 226C230 196 236 172 228 140" stroke-width="7"/>
    <path d="M230 176c-14-8-22-20-26-34M229 158c12-8 22-10 32-24M228 142c-4-12 2-22 0-30M204 144c-8-2-12-8-14-14M258 136c4-8 12-10 16-16" stroke-width="3.5"/>
  </g>

  <!-- foreground bank -->
  <path d="M0 262C180 244 360 240 560 250S860 270 1040 258 1360 238 1600 250V300H0Z" fill="#606c38"/>

  <!-- Rogue tents with pennants -->
  <path d="M478.0 250L520 196L562.0 250Z" fill="#dda15e"/>
  <path d="M478.0 250L520 196L509.9 250Z" fill="#c98b4b"/>
  <path d="M511.6 250L520 220.3L528.4 250Z" fill="#4a3520"/>
  <path d="M520 196V180" stroke="#5e3b20" stroke-width="2"/>
  <path class="flag" d="M520 180l13 4-13 5z" fill="#bc6c25"/>
  <path d="M772.0 262L808 216L844.0 262Z" fill="#dda15e"/>
  <path d="M772.0 262L808 216L799.4 262Z" fill="#c98b4b"/>
  <path d="M800.8 262L808 236.7L815.2 262Z" fill="#4a3520"/>
  <path d="M808 216V200" stroke="#5e3b20" stroke-width="2"/>
  <path class="flag" d="M808 200l13 4-13 5z" fill="#bc6c25"/>

  <!-- the stash by the fire -->
  <g>
    <rect x="712" y="244" width="34" height="18" rx="2" fill="#7d5230"/>
    <path d="M712 246a17 7 0 0 1 34 0z" fill="#8e6038"/>
    <rect x="712" y="244" width="34" height="3" fill="#5e3b20"/>
    <rect x="726" y="240" width="6" height="22" fill="#dda15e"/>
    <rect x="727" y="249" width="4" height="5" fill="#5e3b20"/>
  </g>

  <!-- a waypoint: a stone dais with its ring of runes lit and a column of light -->
  <g>
    <ellipse class="wp" cx="1300" cy="240" rx="72" ry="22" fill="url(#wpglow)"/>
    <path class="wp" d="M1268 248V170h64v78z" fill="url(#beam)"/>
    <ellipse cx="1300" cy="253" rx="58" ry="10" fill="#7c7a66"/>
    <ellipse cx="1300" cy="249" rx="52" ry="8" fill="#a8a58f"/>
    <ellipse class="wp" cx="1300" cy="249" rx="34" ry="5" fill="none" stroke="#6fb1c9" stroke-width="3"/>
    <g fill="#4f8fa8">
      <rect x="1278" y="245" width="3" height="3"/><rect x="1298" y="243" width="4" height="3"/>
      <rect x="1319" y="245" width="3" height="3"/><rect x="1288" y="252" width="3" height="3"/>
      <rect x="1309" y="252" width="3" height="3"/>
    </g>
  </g>

  <!-- a town portal -->
  <g>
    <ellipse class="wp" cx="1450" cy="244" rx="46" ry="12" fill="url(#wpglow)"/>
    <ellipse cx="1450" cy="212" rx="21" ry="36" fill="url(#portal)" stroke="#2f5f7a" stroke-width="3"/>
    <g class="swirl" fill="none" stroke="#eef6f4" stroke-width="2" stroke-linecap="round" opacity=".75">
      <path d="M1450 190c10 4 12 16 4 22s-18 2-16-8"/>
      <path d="M1442 228c-6-6-4-14 2-16"/>
    </g>
  </g>

  <!-- the Rogue camp fire -->
  <ellipse class="glow" cx="640" cy="244" rx="120" ry="44" fill="url(#fireglow)"/>
  <ellipse cx="640" cy="262" rx="62" ry="9" fill="#4a5530"/>
  <g fill="#8d8a76">
    <ellipse cx="598" cy="258" rx="11" ry="7"/>
    <ellipse cx="682" cy="258" rx="11" ry="7"/>
    <ellipse cx="620" cy="264" rx="10" ry="6"/>
    <ellipse cx="660" cy="264" rx="10" ry="6"/>
  </g>
  <g>
    <path class="fl f1" d="M640 256c-26 0-36-18-30-36 4-12 14-18 12-32 12 8 16 18 16 26 6-6 6-16 4-24 16 10 30 26 28 44-2 14-12 22-30 22z" fill="#bc6c25"/>
    <path class="fl f2" d="M640 256c-15 0-22-10-19-22 2-8 9-12 9-21 8 6 11 13 11 19 4-4 5-9 4-14 9 6 16 16 15 27-1 7-8 11-20 11z" fill="#dda15e"/>
    <path class="fl f3" d="M640 256c-7 0-11-5-9-11 1-5 5-7 5-12 5 4 7 8 7 11 3-2 4-5 3-8 5 4 8 9 7 14-1 4-5 6-13 6z" fill="#fefae0"/>
  </g>
  <g stroke-linecap="round">
    <path d="M608 262l66-16" stroke="#6b4426" stroke-width="10"/>
    <path d="M606 246l68 16" stroke="#7d5230" stroke-width="10"/>
  </g>

  <!-- grass tufts -->
  <g fill="none" stroke="#283618" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M90 268l6-16 5 12 5-14 6 18"/>
    <path d="M420 262l5-13 4 10 4-12 5 15"/>
    <path d="M850 272l6-16 5 12 5-14 6 18"/>
    <path d="M1380 258l5-13 4 10 4-12 5 15"/>
    <path d="M1520 270l6-16 5 12 5-14 6 18"/>
  </g>
</svg>
