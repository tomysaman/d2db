<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <!-- a hanging Diablo II healing potion, cut from paper: round flask, cork, red draught -->
  <line x1="60" y1="0" x2="60" y2="104" stroke="#4a3622" stroke-opacity=".55" stroke-width="1"/>
  <!-- string wrap and cork -->
  <rect x="51" y="102" width="18" height="16" rx="3" fill="#8a5a14"/>
  <path d="M51 106h18M51 110h18" stroke="#6b4426" stroke-width="1.4"/>
  <!-- glass: neck and bowl, darker rim layer behind -->
  <path d="M47 116h26v4h-3v14a32 32 0 1 1-20 0v-14h-3z" fill="#c9b48c"/>
  <path d="M49 118h22v3h-3v15a29 29 0 1 1-16 0v-15h-3z" fill="#f3e8d2"/>
  <!-- the red draught, with a darker lower sheet -->
  <path d="M35.6 152a26 26 0 1 0 48.8 0q-6 3-12 0t-12 0-12 0-12.8 0z" fill="#b33a22"/>
  <path d="M40 176a26 26 0 0 0 40 0q-10 6-20 3t-20-3z" fill="#8a2a18"/>
  <!-- highlight on the glass -->
  <path d="M44 146q-6 8-5 18" fill="none" stroke="#fffaf0" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
  <circle cx="72" cy="160" r="2.4" fill="#f6c6a8" opacity=".8"/>
  <circle cx="66" cy="170" r="1.6" fill="#f6c6a8" opacity=".7"/>
</svg>
