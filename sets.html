<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo II Codex — Item Sets</title>
  <meta name="description" content="Browse all 35 Diablo II: Resurrected item sets, with every piece and its partial and full set bonuses." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Diablo II Codex" />
  <meta property="og:title" content="Diablo II Codex — Item Sets" />
  <meta property="og:description" content="Browse all 35 Diablo II: Resurrected item sets, with every piece and its partial and full set bonuses." />
  <meta property="og:url" content="https://tomysaman.github.io/d2db/sets.html" />
  <meta property="og:image" content="https://tomysaman.github.io/d2db/assets/social/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Diablo II Codex: 104 runewords, 35 item sets, 130 cube recipes" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" id="theme-minimal" />
  <link rel="stylesheet" href="styles-glass.css" id="theme-glass" />
  <link rel="stylesheet" href="styles-atlas.css" id="theme-atlas" />
  <link rel="stylesheet" href="styles-paper.css" id="theme-paper" />
  <link rel="stylesheet" href="styles-meadow.css" id="theme-meadow" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="sets-styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════ HEADER ══ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-block">
        <h1 class="site-title">Diablo II <em>Codex</em></h1>
        <p class="site-subtitle">Diablo II: Resurrected · Reign of the Warlock</p>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">Runewords</a>
        <a href="sets.html" class="nav-link active">Item Sets</a>
        <a href="recipes.html" class="nav-link">Cube Recipes</a>
      </nav>
      <button type="button" class="theme-toggle" id="themeToggle">
        <span class="theme-toggle-swatch" aria-hidden="true"></span>
        <span class="theme-toggle-label">Stained Glass theme</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════ FILTERS ══ -->
  <section class="filters-section">
    <div class="filters-inner">

      <div class="filter-block filter-search-block">
        <label class="filter-label">Search</label>
        <div class="search-stats-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Set name, piece, or stat..." autocomplete="off" />
          <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="statTotal">— sets</span>
            <span class="stat-pill" id="statShown">— shown</span>
            <button class="reset-btn" id="resetBtn">Reset filters</button>
          </div>
        </div>
      </div>

      <div class="filter-block">
        <label class="filter-label">Tier</label>
        <div class="pill-group" id="tierFilter"></div>
      </div>

      <div class="filter-block">
        <label class="filter-label">Class</label>
        <div class="pill-group" id="classFilter"></div>
      </div>

      <div class="filter-block filter-source-ladder-row">
        <div class="source-ladder-group">
          <label class="filter-label">Content</label>
          <div class="pill-group" id="contentFilter">
            <button class="pill active" data-content="all">All</button>
            <button class="pill" data-content="classic">Classic / LoD / 2.6</button>
            <button class="pill" data-content="new">Reign of the Warlock</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════ RESULTS ══ -->
  <main class="results-section">
    <div class="sort-bar">
      <span class="sort-label">Sort</span>
      <button class="sort-btn active" data-sort="name">Name</button>
      <button class="sort-btn" data-sort="level">Level</button>
      <button class="stat-view-toggle active" id="statViewToggle"><span id="statToggleLabel">Collapse stats</span></button>
    </div>
    <div id="setsGrid" class="sets-grid"></div>
    <div id="emptyState" class="empty-state hidden">
      <p>No sets match your current filters.</p>
      <button class="reset-btn" onclick="resetAll()">Reset Filters</button>
    </div>
  </main>

  <!-- ═══════════════════════════════════ MODAL ══ -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Data sourced from Diablo II: Resurrected — Reign of the Warlock. Fan-made reference tool.</p>

  </footer>

  <script src="data/sets-data.js"></script>
  <script src="sets-app.js"></script>
</body>
</html>
